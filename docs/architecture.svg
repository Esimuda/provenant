<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#F6F3EE"/>
  <text x="48" y="64" fill="#0E1116" font-family="Georgia, serif" font-size="36">Provenant on Portaldot V3</text>
  <text x="48" y="98" fill="#5C564E" font-family="sans-serif" font-size="16">A sentence becomes a locked NFT, a manifest, a proof, and a royalty.</text>
  <g font-family="sans-serif" font-size="15" fill="#0E1116">
    <rect x="48" y="150" width="200" height="88" fill="#FFFFFF" stroke="#E4DDD4"/>
    <text x="64" y="184">Author browser</text>
    <text x="64" y="210" fill="#5C564E" font-size="13">SHA-256 chunks</text>
    <rect x="320" y="150" width="230" height="88" fill="#FFFFFF" stroke="#E4DDD4"/>
    <text x="336" y="184">nfts + utility.batchAll</text>
    <text x="336" y="210" fill="#5C564E" font-size="13">Licence locked</text>
    <rect x="620" y="150" width="250" height="88" fill="#FFFFFF" stroke="#E4DDD4"/>
    <text x="636" y="184">transactionStorage</text>
    <text x="636" y="210" fill="#5C564E" font-size="13">Manifest bytes</text>
    <rect x="940" y="150" width="210" height="88" fill="#FFFFFF" stroke="#E8572A"/>
    <text x="956" y="184">Provenant.sol</text>
    <text x="956" y="210" fill="#5C564E" font-size="13">Root + tPOT deposit</text>
    <rect x="320" y="390" width="230" height="88" fill="#FFFFFF" stroke="#E4DDD4"/>
    <text x="336" y="424">identity.setIdentity</text>
    <text x="336" y="450" fill="#5C564E" font-size="13">Self-declared</text>
    <rect x="620" y="390" width="250" height="88" fill="#FFFFFF" stroke="#2F6B5E"/>
    <text x="636" y="424">RoyaltyPaid</text>
    <text x="636" y="450" fill="#5C564E" font-size="13">Author is paid now</text>
    <rect x="940" y="390" width="210" height="88" fill="#FFFFFF" stroke="#E4DDD4"/>
    <text x="956" y="424">vesting pallet</text>
    <text x="956" y="450" fill="#5C564E" font-size="13">Relayer streams the rest</text>
  </g>
  <g stroke="#E8572A" stroke-width="2" fill="none">
    <path d="M248 194 H320"/>
    <path d="M550 194 H620"/>
    <path d="M870 194 H940"/>
    <path d="M1045 238 V390"/>
    <path d="M940 434 H870"/>
    <path d="M620 434 H550"/>
  </g>
  <text x="48" y="560" fill="#5C564E" font-family="sans-serif" font-size="14">No precompile joins revive to nfts, identity, or vesting. The relayer is the glue, and the README says so.</text>
</svg>
